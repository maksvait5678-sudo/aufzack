<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auf Zack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F3F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <a class="home-btn" href="index.html" aria-label="До вибору теми (Auf Zack)">
        <svg class="mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <circle cx="20" cy="37" r="10" fill="currentColor"/>
          <circle cx="44" cy="27" r="10" fill="var(--brand-accent)"/>
        </svg>
      </a>
      <div class="topic-logo" id="topicLogo"></div>
    </div>
    <div class="modes" role="group" aria-label="Режим">
      <button id="mLearn" aria-pressed="true">Навчання</button>
      <button id="mDrill" aria-pressed="false">Профілактика</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sDue">0</b><small>на черзі</small></div>
    <div class="stat"><b id="sLearned">0/0</b><small>вивчено</small></div>
    <div class="stat"><b id="sStreak">0</b><small>серія (рекорд <span id="sBest">0</span>)</small></div>
    <div class="stat"><b id="sToday">0</b><small>відповідей сьогодні</small></div>
  </div>

  <div class="card" id="card" aria-live="polite"></div>

  <section class="map">
    <div class="map-top">
      <h2>Карта засвоєння</h2>
      <button class="btn ghost" id="peek">Підглянути таблицю</button>
    </div>
    <div class="heat" id="heat"></div>
  </section>

  <div class="nudge" id="saveNudge" hidden></div>

  <footer>
    <span id="sync">Прогрес живе лише в цьому браузері. Збережи код, щоб перенести його на інший пристрій.</span>
    <span>
      <button class="linkbtn" id="exportBtn">Зберегти прогрес</button>
      ·
      <button class="linkbtn" id="importBtn">Перенести прогрес сюди</button>
      ·
      <button class="linkbtn" id="reset">Скинути прогрес</button>
    </span>
  </footer>
  <div class="io-panel" id="ioPanel"></div>

  <p style="margin-top:14px"><a class="linkbtn" href="index.html">← До вибору теми</a></p>
</div>

<script type="module">
import { getTopic } from './js/topics/index.js';
import { createSession } from './js/engine/session.js';
import * as store from './js/engine/store.js';
import { renderCard, showChoiceFeedback, showGridFeedback, renderDone } from './js/ui/render.js';
import { renderHeat } from './js/ui/heat.js';
import { renderStats } from './js/ui/stats.js';
import { bindKeyboard } from './js/ui/keyboard.js';

const params = new URLSearchParams(location.search);
const topic = getTopic(params.get('topic') || 'artikel');
if (!topic) {
  document.querySelector('.wrap').innerHTML = '<p>Тему не знайдено.</p><p><a href="index.html">До вибору теми</a></p>';
  throw new Error('topic not found');
}

const session = createSession(topic);

// Лого теми в шапці (з її матеріалу); Auf Zack — лише кнопка повернення в хаб.
document.getElementById('topicLogo').innerHTML = topic.logo || topic.title;
document.title = `Auf Zack — ${topic.title}`;

const cardEl = document.getElementById('card');
const heatEl = document.getElementById('heat');
const statEls = {
  due: document.getElementById('sDue'),
  learned: document.getElementById('sLearned'),
  streak: document.getElementById('sStreak'),
  best: document.getElementById('sBest'),
  today: document.getElementById('sToday')
};

let peek = false, autoT = null, sel = new Set();

function refresh() {
  renderStats(statEls, topic, session.data);
  renderHeat(heatEl, topic, session.data.cards, peek);
}

function advance() {
  clearTimeout(autoT);
  sel = new Set();
  cardEl.classList.remove('flash-ok', 'flash-bad');
  const cur = session.next();
  if (!cur) { renderDone(cardEl, session.data, topic.cards.length, () => setMode('drill')); return; }
  renderCard(cardEl, topic, cur, session.stateOf(cur.card.id), {
    onChoose: choose,
    onToggleCell: (k, el) => {
      if (session.answered) return;
      if (sel.has(k)) { sel.delete(k); el.setAttribute('aria-pressed', 'false'); }
      else { sel.add(k); el.setAttribute('aria-pressed', 'true'); }
    },
    onCheck: checkRev
  });
}

function choose(a) {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const ok = a === c.answer;
  const fast = session.answer(c, ok, ms);
  refresh();
  afterAnswer();
  showChoiceFeedback(cardEl, topic, c, a, ms, fast, ok, advance);
  if (ok) autoT = setTimeout(advance, fast ? 750 : 1500);
}

function checkRev() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const want = new Set(c.cells);
  const ok = want.size === sel.size && [...want].every(k => sel.has(k));
  const fast = session.answer(c, ok, ms);
  refresh();
  afterAnswer();
  showGridFeedback(cardEl, topic, c, sel, ms, fast, ok, advance);
  if (ok) autoT = setTimeout(advance, fast ? 900 : 1600);
}

// Порахувати відповідь для нагадування «збережи прогрес» і, за потреби, показати його.
function afterAnswer() {
  store.noteAnswered();
  if (store.shouldNudgeSave()) showNudge();
}

// Ненав'язливе одноразове нагадування зберегти код, коли прогресу вже назбиралось.
function showNudge() {
  store.markNudged(); // одноразово: незалежно від дії учня більше не показуємо
  const n = document.getElementById('saveNudge');
  n.innerHTML = `<p>Уже понад ${store.NUDGE_AFTER} відповідей, а прогрес ще ніде не збережено — він живе лише в цьому браузері. Збережи код, щоб не втратити його.</p><button class="btn" id="nudgeSave">Зберегти прогрес</button><button class="linkbtn x" id="nudgeClose" aria-label="Закрити нагадування">✕</button>`;
  n.hidden = false;
  document.getElementById('nudgeSave').addEventListener('click', () => { n.hidden = true; openExport(); });
  document.getElementById('nudgeClose').addEventListener('click', () => { n.hidden = true; });
}

function setMode(m) {
  const applied = session.setMode(m);
  document.getElementById('mLearn').setAttribute('aria-pressed', applied === 'learn');
  document.getElementById('mDrill').setAttribute('aria-pressed', applied === 'drill');
  advance();
}

// ---- експорт / імпорт прогресу ----
const ioPanel = document.getElementById('ioPanel');
function closeIO() { ioPanel.classList.remove('show'); ioPanel.innerHTML = ''; }
function ioMsg(kind, text) { const m = document.getElementById('ioMsg'); if (m) { m.textContent = text; m.className = 'io-msg ' + kind; } }

function openExport() {
  store.noteSaved(); // скористався збереженням — нагадування знімаємо
  const code = store.exportCode();
  ioPanel.innerHTML = `<h3>Код прогресу</h3><p>Скопіюй цей код і встав його на іншому пристрої через «Перенести прогрес сюди».</p><textarea id="ioText" readonly>${code}</textarea><div class="io-actions"><button class="btn" id="ioCopy">Копіювати</button><button class="btn ghost" id="ioClose">Закрити</button></div><div class="io-msg" id="ioMsg"></div>`;
  ioPanel.classList.add('show');
  const ta = document.getElementById('ioText');
  document.getElementById('ioCopy').addEventListener('click', async () => {
    ta.select();
    try { await navigator.clipboard.writeText(code); ioMsg('ok', 'Скопійовано.'); }
    catch (e) { try { document.execCommand('copy'); ioMsg('ok', 'Скопійовано.'); } catch (_) { ioMsg('bad', 'Скопіюй вручну: Ctrl/Cmd+C.'); } }
  });
  document.getElementById('ioClose').addEventListener('click', closeIO);
  ta.focus();
}

function openImport() {
  ioPanel.innerHTML = `<h3>Імпорт прогресу</h3><p>Встав код з іншого пристрою. Поточний прогрес буде замінено.</p><textarea id="ioText" placeholder="Встав код тут"></textarea><div class="io-actions"><button class="btn" id="ioApply">Застосувати</button><button class="btn ghost" id="ioClose">Закрити</button></div><div class="io-msg" id="ioMsg"></div>`;
  ioPanel.classList.add('show');
  document.getElementById('ioApply').addEventListener('click', () => {
    try { store.importCode(document.getElementById('ioText').value); location.reload(); }
    catch (e) { ioMsg('bad', e.message || 'Не вдалося імпортувати.'); }
  });
  document.getElementById('ioClose').addEventListener('click', closeIO);
  document.getElementById('ioText').focus();
}

// ---- прив'язки ----
document.getElementById('mLearn').addEventListener('click', () => setMode('learn'));
document.getElementById('mDrill').addEventListener('click', () => setMode('drill'));
document.getElementById('peek').addEventListener('click', e => {
  peek = !peek;
  e.target.textContent = peek ? 'Сховати таблицю' : 'Підглянути таблицю';
  renderHeat(heatEl, topic, session.data.cards, peek);
});
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Скинути весь прогрес?')) { session.reset(); closeIO(); refresh(); setMode('learn'); }
});
document.getElementById('exportBtn').addEventListener('click', openExport);
document.getElementById('importBtn').addEventListener('click', openImport);

bindKeyboard({
  getCur: () => session.cur,
  isAnswered: () => session.answered,
  getAnswers: () => topic.answers,
  onChoose: choose,
  onCheck: checkRev,
  onNext: advance
});

setInterval(() => {
  refresh();
  if (!session.cur && session.mode === 'learn' && session.pickNext()) advance();
}, 15000);

refresh();
advance();
</script>
</body>
</html>
