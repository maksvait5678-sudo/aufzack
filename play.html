<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auf Zack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F3F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <a class="home-btn" href="index.html" data-i18n-aria="ui.play.homeAria">
        <svg class="mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <circle cx="20" cy="37" r="10" fill="currentColor"/>
          <circle cx="44" cy="27" r="10" fill="var(--brand-accent)"/>
        </svg>
      </a>
      <div class="topic-logo" id="topicLogo"></div>
    </div>
    <div class="modes" role="group" data-i18n-aria="ui.play.modeGroupAria">
      <button id="mLearn" aria-pressed="true" data-i18n="ui.play.learn"></button>
      <button id="mDrill" aria-pressed="false" data-i18n="ui.play.drill"></button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sDue">0</b><small data-i18n="ui.play.statDue"></small></div>
    <div class="stat"><b id="sLearned">0/0</b><small data-i18n="ui.play.statLearned"></small></div>
    <div class="stat"><b id="sStreak">0</b><small id="lStreak"></small></div>
    <div class="stat"><b id="sToday">0</b><small data-i18n="ui.play.statToday"></small></div>
  </div>

  <div class="card" id="card" aria-live="polite"></div>

  <section class="map">
    <div class="map-top">
      <h2 data-i18n="ui.play.mapTitle"></h2>
      <button class="btn ghost" id="peek" data-i18n="ui.play.peekShow"></button>
    </div>
    <div class="heat" id="heat"></div>
  </section>

  <footer>
    <span id="sync" data-i18n="ui.play.syncNote"></span>
    <span>
      <button class="linkbtn" id="exportBtn" data-i18n="ui.play.exportBtn"></button>
      ·
      <button class="linkbtn" id="importBtn" data-i18n="ui.play.importBtn"></button>
      ·
      <button class="linkbtn" id="reset" data-i18n="ui.play.reset"></button>
    </span>
  </footer>
  <div class="io-panel" id="ioPanel"></div>

  <p style="margin-top:14px"><a class="linkbtn" href="index.html" data-i18n="ui.play.back"></a></p>
</div>

<script type="module">
import { getTopic } from './js/topics/index.js';
import { createSession } from './js/engine/session.js';
import * as store from './js/engine/store.js';
import { renderCard, showChoiceFeedback, showGridFeedback, renderDone } from './js/ui/render.js';
import { renderHeat } from './js/ui/heat.js';
import { renderStats } from './js/ui/stats.js';
import { bindKeyboard } from './js/ui/keyboard.js';
import { initLang, applyDom, t } from './js/i18n/index.js';

initLang();
applyDom();

const params = new URLSearchParams(location.search);
const topic = getTopic(params.get('topic') || 'artikel');
if (!topic) {
  document.querySelector('.wrap').innerHTML = `<p>${t('ui.play.notFound')}</p><p><a href="index.html">${t('ui.play.notFoundLink')}</a></p>`;
  throw new Error('topic not found');
}

const session = createSession(topic);
const topicTitle = t(`topics.${topic.id}.title`);

// Лого теми в шапці (з її матеріалу); Auf Zack — лише кнопка повернення в хаб.
document.getElementById('topicLogo').innerHTML = topic.logo || topicTitle;
document.title = t('ui.play.title', { topic: topicTitle });

const cardEl = document.getElementById('card');
const heatEl = document.getElementById('heat');
const statEls = {
  due: document.getElementById('sDue'),
  learned: document.getElementById('sLearned'),
  streak: document.getElementById('sStreak'),
  streakLabel: document.getElementById('lStreak'),
  today: document.getElementById('sToday')
};

let peek = false, autoT = null, sel = new Set();

function refresh() {
  renderStats(statEls, topic, session.data);
  renderHeat(heatEl, topic, session.data.cards, peek);
}

function advance() {
  clearTimeout(autoT);
  sel = new Set();
  cardEl.classList.remove('flash-ok', 'flash-bad');
  const cur = session.next();
  if (!cur) { renderDone(cardEl, session.data, topic.cards.length, () => setMode('drill')); return; }
  renderCard(cardEl, topic, cur, session.stateOf(cur.card.id), {
    onChoose: choose,
    onToggleCell: (k, el) => {
      if (session.answered) return;
      if (sel.has(k)) { sel.delete(k); el.setAttribute('aria-pressed', 'false'); }
      else { sel.add(k); el.setAttribute('aria-pressed', 'true'); }
    },
    onCheck: checkRev
  });
}

function choose(a) {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const ok = a === c.answer;
  const fast = session.answer(c, ok, ms);
  refresh();
  showChoiceFeedback(cardEl, topic, c, a, ms, fast, ok, advance);
  if (ok) autoT = setTimeout(advance, fast ? 750 : 1500);
}

function checkRev() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const want = new Set(c.cells);
  const ok = want.size === sel.size && [...want].every(k => sel.has(k));
  const fast = session.answer(c, ok, ms);
  refresh();
  showGridFeedback(cardEl, topic, c, sel, ms, fast, ok, advance);
  if (ok) autoT = setTimeout(advance, fast ? 900 : 1600);
}

function setMode(m) {
  const applied = session.setMode(m);
  document.getElementById('mLearn').setAttribute('aria-pressed', applied === 'learn');
  document.getElementById('mDrill').setAttribute('aria-pressed', applied === 'drill');
  advance();
}

// ---- експорт / імпорт прогресу ----
const ioPanel = document.getElementById('ioPanel');
function closeIO() { ioPanel.classList.remove('show'); ioPanel.innerHTML = ''; }
function ioMsg(kind, text) { const m = document.getElementById('ioMsg'); if (m) { m.textContent = text; m.className = 'io-msg ' + kind; } }

function openExport() {
  const code = store.exportCode();
  ioPanel.innerHTML = `<h3>${t('ui.io.exportTitle')}</h3><p>${t('ui.io.exportHint')}</p><textarea id="ioText" readonly>${code}</textarea><div class="io-actions"><button class="btn" id="ioCopy">${t('ui.io.copy')}</button><button class="btn ghost" id="ioClose">${t('ui.io.close')}</button></div><div class="io-msg" id="ioMsg"></div>`;
  ioPanel.classList.add('show');
  const ta = document.getElementById('ioText');
  document.getElementById('ioCopy').addEventListener('click', async () => {
    ta.select();
    try { await navigator.clipboard.writeText(code); ioMsg('ok', t('ui.io.copied')); }
    catch (e) { try { document.execCommand('copy'); ioMsg('ok', t('ui.io.copied')); } catch (_) { ioMsg('bad', t('ui.io.copyManual')); } }
  });
  document.getElementById('ioClose').addEventListener('click', closeIO);
  ta.focus();
}

function openImport() {
  ioPanel.innerHTML = `<h3>${t('ui.io.importTitle')}</h3><p>${t('ui.io.importHint')}</p><textarea id="ioText" placeholder="${t('ui.io.importPlaceholder')}"></textarea><div class="io-actions"><button class="btn" id="ioApply">${t('ui.io.apply')}</button><button class="btn ghost" id="ioClose">${t('ui.io.close')}</button></div><div class="io-msg" id="ioMsg"></div>`;
  ioPanel.classList.add('show');
  document.getElementById('ioApply').addEventListener('click', () => {
    try { store.importCode(document.getElementById('ioText').value); location.reload(); }
    catch (e) { const k = ['errBad', 'errIncompatible'].includes(e.message) ? e.message : 'errGeneric'; ioMsg('bad', t('ui.io.' + k)); }
  });
  document.getElementById('ioClose').addEventListener('click', closeIO);
  document.getElementById('ioText').focus();
}

// ---- прив'язки ----
document.getElementById('mLearn').addEventListener('click', () => setMode('learn'));
document.getElementById('mDrill').addEventListener('click', () => setMode('drill'));
document.getElementById('peek').addEventListener('click', e => {
  peek = !peek;
  e.target.textContent = t(peek ? 'ui.play.peekHide' : 'ui.play.peekShow');
  renderHeat(heatEl, topic, session.data.cards, peek);
});
document.getElementById('reset').addEventListener('click', () => {
  if (confirm(t('ui.play.resetConfirm'))) { session.reset(); closeIO(); refresh(); setMode('learn'); }
});
document.getElementById('exportBtn').addEventListener('click', openExport);
document.getElementById('importBtn').addEventListener('click', openImport);

bindKeyboard({
  getCur: () => session.cur,
  isAnswered: () => session.answered,
  getAnswers: () => topic.answers,
  onChoose: choose,
  onCheck: checkRev,
  onNext: advance
});

setInterval(() => {
  refresh();
  if (!session.cur && session.mode === 'learn' && session.pickNext()) advance();
}, 15000);

refresh();
advance();
</script>
</body>
</html>
