<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auf Zack</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F3F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17171A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-left">
      <a class="home-btn" href="index.html" aria-label="До вибору теми (Auf Zack)">
        <svg class="mark" viewBox="0 0 64 64" width="28" height="28" aria-hidden="true">
          <circle cx="20" cy="37" r="10" fill="currentColor"/>
          <circle cx="44" cy="27" r="10" fill="var(--brand-accent)"/>
        </svg>
      </a>
      <div class="topic-logo" id="topicLogo"></div>
    </div>
    <div class="head-right">
      <div class="modes" role="group" aria-label="Режим">
        <button id="mLearn" aria-pressed="true">Навчання</button>
        <button id="mDrill" aria-pressed="false">Профілактика</button>
      </div>
      <div class="head-actions" id="headActions"></div>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="sDue">0</b><small>на черзі</small></div>
    <div class="stat"><b id="sLearned">0/0</b><small>вивчено</small></div>
    <div class="stat"><b id="sStreak">0</b><small>серія (рекорд <span id="sBest">0</span>)</small></div>
    <div class="stat"><b id="sToday">0</b><small>відповідей сьогодні</small></div>
  </div>

  <div class="card" id="card" aria-live="polite"></div>
  <div class="peek-note" id="peekNote" hidden>Таблиця відкрита — ця відповідь не враховується.</div>

  <section class="map">
    <div class="map-top">
      <h2>Карта засвоєння</h2>
      <button class="btn ghost" id="peek">Підглянути таблицю</button>
    </div>
    <div class="heat" id="heat"></div>
  </section>

  <div class="nudge" id="saveNudge" hidden></div>

  <footer>
    <span id="sync">Прогрес живе лише в цьому браузері. Збережи код, щоб перенести його на інший пристрій.</span>
    <span>
      <button class="linkbtn" id="exportBtn">Зберегти прогрес</button>
      ·
      <button class="linkbtn" id="importBtn">Перенести прогрес сюди</button>
      ·
      <button class="linkbtn" id="reset">Скинути прогрес</button>
    </span>
  </footer>
  <div class="io-panel" id="ioPanel"></div>

  <p style="margin-top:14px"><a class="linkbtn" href="index.html">← До вибору теми</a></p>
</div>

<script type="module">
import { getTopic } from './js/topics/index.js';
import { createSession } from './js/engine/session.js';
import * as store from './js/engine/store.js';
import { renderCard, showChoiceFeedback, showGridFeedback, showTypeFeedback, showOrderFeedback, showWordFeedback, paintOrder, showTwoStepStep1, showTwoStepStep2, renderDone } from './js/ui/render.js';
import { FAST_STEP1, FAST, typeMatches, matchOrder } from './js/engine/srs.js';
import { renderHeat } from './js/ui/heat.js';
import { renderStats } from './js/ui/stats.js';
import { bindKeyboard } from './js/ui/keyboard.js';
import { mountHelp } from './js/ui/help.js';

mountHelp(document.getElementById('headActions'));

const params = new URLSearchParams(location.search);
const topic = getTopic(params.get('topic') || 'artikel');
if (!topic) {
  document.querySelector('.wrap').innerHTML = '<p>Тему не знайдено.</p><p><a href="index.html">До вибору теми</a></p>';
  throw new Error('topic not found');
}

const session = createSession(topic);

// Лого теми в шапці (з її матеріалу); Auf Zack — лише кнопка повернення в хаб.
document.getElementById('topicLogo').innerHTML = topic.logo || topic.title;
document.title = `Auf Zack — ${topic.title}`;

const cardEl = document.getElementById('card');
const heatEl = document.getElementById('heat');
const statEls = {
  due: document.getElementById('sDue'),
  learned: document.getElementById('sLearned'),
  streak: document.getElementById('sStreak'),
  best: document.getElementById('sBest'),
  today: document.getElementById('sToday')
};

let peek = false, autoT = null, sel = new Set(), ts = null; // ts — стан двокрокової картки
let order = null; // order — транзієнтний стан конструктора { placed, bank } (масиви {id,text})
let wordView = null; // wordView — поточний вигляд слова-картки (mode/options) для клавіатури

// Поточна сходинка слова-картки (зі стану; нова картка — 0).
function stepOf(card) { const s = session.stateOf(card.id); return (s && s.step) || 0; }
// Чи поточна картка вводиться текстом (type, або слово на сходинці 2) — для клавіатури.
function isTextEntry() {
  const cur = session.cur; if (!cur) return false;
  const c = cur.card;
  if (c.type === 'type') return true;
  if (c.type === 'word') return stepOf(c) === 2;
  return false;
}

// Фішер-Єйтс: перемішати розсип слів (детермінованість тут не потрібна).
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function refresh() {
  renderStats(statEls, topic, session.data);
  renderHeat(heatEl, topic, session.data.cards, peek);
}

// Позначка біля картки: показуємо, поки стоїть прапорець підглядання (зберігається
// й після закриття таблиці — до переходу на наступну картку).
function updatePeekNote() {
  document.getElementById('peekNote').hidden = !session.peeked;
}

// Додати у фідбек рядок «не зараховано», коли відповідь була під підгляданням.
function markFbNotCounted() {
  if (!session.peeked) return;
  const fb = document.getElementById('fb');
  if (fb) fb.insertAdjacentHTML('afterbegin', '<div class="fb-note">Не зараховано: таблиця була відкрита.</div>');
}

function advance() {
  clearTimeout(autoT);
  sel = new Set();
  cardEl.classList.remove('flash-ok', 'flash-bad');
  const cur = session.next();
  // Якщо таблиця лишилась відкритою — нова картка теж одразу «під підгляданням».
  if (cur && peek) session.markPeeked();
  updatePeekNote();
  if (!cur) { renderDone(cardEl, session.data, topic.cards.length, () => setMode('drill')); return; }
  ts = cur.card.type === 'twostep' ? { phase: 'step1' } : null;
  wordView = null;
  // Конструктор: створюємо екземпляри слів (id+text) з банку картки, перемішуємо; усі в розсипі.
  order = cur.card.type === 'order'
    ? { placed: [], bank: shuffle(cur.card.bank.map((text, i) => ({ id: String(i), text }))) }
    : null;
  renderCard(cardEl, topic, cur, session.stateOf(cur.card.id), {
    onChoose,
    onToggleCell: (k, el) => {
      if (session.answered) return;
      if (sel.has(k)) { sel.delete(k); el.setAttribute('aria-pressed', 'false'); }
      else { sel.add(k); el.setAttribute('aria-pressed', 'true'); }
    },
    getOrder: () => order,
    onPlace: id => moveWord(id, order.bank, order.placed),
    onUnplace: id => moveWord(id, order.placed, order.bank),
    onWordView: v => { wordView = v; },
    onDunno: wordDunno,
    onCheck: check
  });
}

// Перенести слово між розсипом і рядком (конструктор). Після відповіді — заблоковано.
function moveWord(id, from, to) {
  if (session.answered || !order) return;
  const i = from.findIndex(w => w.id === id);
  if (i < 0) return;
  to.push(from.splice(i, 1)[0]);
  paintOrder(cardEl, order, { getOrder: () => order, onPlace: id => moveWord(id, order.bank, order.placed), onUnplace: id => moveWord(id, order.placed, order.bank) });
}

// Перевірка відповіді для карток без вибору: grid (клітинки), type (ввід форми), order (порядок).
function check() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  if (cur.card.type === 'grid') return checkRev();
  if (cur.card.type === 'type') return checkType();
  if (cur.card.type === 'order') return checkOrder();
  if (cur.card.type === 'word') return checkWord();
}

// Картка order: порівняння порядку складених слів з усіма допустимими варіантами (srs.matchOrder).
function checkOrder() {
  const cur = session.cur;
  if (session.answered || !cur || !order || !order.placed.length) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const res = matchOrder(order.placed.map(w => w.text), c.solutions);
  const fast = session.answer(c, res.ok, ms);
  refresh();
  if (!session.peeked) afterAnswer();
  showOrderFeedback(cardEl, topic, c, ms, fast, res, advance);
  markFbNotCounted();
  if (res.ok && res.good) autoT = setTimeout(advance, fast ? 900 : 1600);
}

// Роутер вибору: двокрокова картка й слово-картка йдуть своїм шляхом, решта — звичайним choose.
function onChoose(a) {
  const cur = session.cur;
  if (!cur) return;
  if (cur.card.type === 'twostep') return twoStepChoose(a);
  if (cur.card.type === 'word') return wordChoose(a);
  return choose(a);
}

// Слово-картка, вибір (сходинки 0/1): порівняння з правильною відповіддю для сходинки.
function wordChoose(a) {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const step = stepOf(c);
  const ms = Date.now() - session.shownAt;
  const ok = a === topic.answerFor(c, step);
  const r = session.answerWord(c, { ok, ms });
  refresh();
  if (!session.peeked) afterAnswer();
  showWordFeedback(cardEl, topic, c, step, { ok: r.ok, articleOnly: false, dunno: false }, a, ms, r.fast, advance);
  markFbNotCounted();
  if (r.ok) autoT = setTimeout(advance, r.fast ? 750 : 1500);
}

// Слово-картка, ввід (сходинка 2): checkInput розрізняє «інше слово» і «бракує артикля».
function checkWord() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const step = stepOf(c);
  if (step !== 2) return;            // сходинки 0/1 — вибір, не ввід
  const inp = document.getElementById('typeInput');
  const val = inp ? inp.value : '';
  const ms = Date.now() - session.shownAt;
  const { ok, articleOnly } = topic.checkInput(c, val);
  const r = session.answerWord(c, { ok, ms, articleOnly });
  refresh();
  if (!session.peeked) afterAnswer();
  showWordFeedback(cardEl, topic, c, step, { ok: r.ok, articleOnly: r.articleOnly, dunno: false }, val, ms, r.fast, advance);
  markFbNotCounted();
  if (r.ok) autoT = setTimeout(advance, r.fast ? 750 : 1500);
}

// Кнопка «Не знаю»: показуємо повну відповідь, скидаємо картку, без автопереходу (хай прочитає).
function wordDunno() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const step = stepOf(c);
  const ms = Date.now() - session.shownAt;
  session.dontKnow(c);
  refresh();
  if (!session.peeked) afterAnswer();
  showWordFeedback(cardEl, topic, c, step, { ok: false, articleOnly: false, dunno: true }, null, ms, false, advance);
  markFbNotCounted();
}

function choose(a) {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const ok = a === c.answer;
  const fast = session.answer(c, ok, ms);
  refresh();
  if (!session.peeked) afterAnswer();
  showChoiceFeedback(cardEl, topic, c, a, ms, fast, ok, advance);
  markFbNotCounted();
  if (ok) autoT = setTimeout(advance, fast ? 750 : 1500);
}

// Двокрокова картка: крок 1 (Wo?/Wohin?) → правило, потім крок 2 (артикль) → таблиця.
// Час кроків рахується окремо. Оцінюємо картку як ціле лише після кроку 2.
function twoStepChoose(a) {
  const cur = session.cur;
  if (!cur || !ts || session.answered) return;
  const c = cur.card;
  if (ts.phase === 'step1') {
    const ms1 = Date.now() - session.shownAt;
    ts.ok1 = a === c.step1.answer;
    ts.ms1 = ms1;
    ts.step2At = Date.now();
    ts.phase = 'step2';
    showTwoStepStep1(cardEl, topic, c, a, ms1, ms1 <= FAST_STEP1, ts.ok1, twoStepChoose);
  } else if (ts.phase === 'step2') {
    const ms2 = Date.now() - ts.step2At;
    const ok2 = a === c.answer;
    ts.phase = 'done';
    const res = session.answerTwoStep(c, { ok1: ts.ok1, ms1: ts.ms1, ok2, ms2 });
    refresh();
    if (!session.peeked) afterAnswer();
    showTwoStepStep2(cardEl, topic, c, a, ms2, res.fast2, ok2, res.ok, advance);
    markFbNotCounted();
    if (res.ok) autoT = setTimeout(advance, res.fast ? 750 : 1500);
  }
}

// Картка type: порівняння через typeMatches (без регістру, умлаути як ae/oe/ue/ss —
// але лише там, де в правильній формі справді є умлаут; див. srs.normType).
function checkType() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const inp = document.getElementById('typeInput');
  const val = inp ? inp.value : '';
  const ms = Date.now() - session.shownAt;
  const ok = typeMatches(val, c.answer);
  const fast = session.answer(c, ok, ms);
  refresh();
  if (!session.peeked) afterAnswer();
  showTypeFeedback(cardEl, topic, c, val, ms, fast, ok, advance);
  markFbNotCounted();
  if (ok) autoT = setTimeout(advance, fast ? 750 : 1500);
}

function checkRev() {
  const cur = session.cur;
  if (session.answered || !cur) return;
  const c = cur.card;
  const ms = Date.now() - session.shownAt;
  const want = new Set(c.cells);
  const ok = want.size === sel.size && [...want].every(k => sel.has(k));
  const fast = session.answer(c, ok, ms);
  refresh();
  if (!session.peeked) afterAnswer();
  showGridFeedback(cardEl, topic, c, sel, ms, fast, ok, advance);
  markFbNotCounted();
  if (ok) autoT = setTimeout(advance, fast ? 900 : 1600);
}

// Порахувати відповідь для нагадування «збережи прогрес» і, за потреби, показати його.
function afterAnswer() {
  store.noteAnswered();
  if (store.shouldNudgeSave()) showNudge();
}

// Ненав'язливе одноразове нагадування зберегти код, коли прогресу вже назбиралось.
function showNudge() {
  store.markNudged(); // одноразово: незалежно від дії учня більше не показуємо
  const n = document.getElementById('saveNudge');
  n.innerHTML = `<p>Уже понад ${store.NUDGE_AFTER} відповідей, а прогрес ще ніде не збережено — він живе лише в цьому браузері. Збережи код, щоб не втратити його.</p><button class="btn" id="nudgeSave">Зберегти прогрес</button><button class="linkbtn x" id="nudgeClose" aria-label="Закрити нагадування">✕</button>`;
  n.hidden = false;
  document.getElementById('nudgeSave').addEventListener('click', () => { n.hidden = true; openExport(); });
  document.getElementById('nudgeClose').addEventListener('click', () => { n.hidden = true; });
}

function setMode(m) {
  const applied = session.setMode(m);
  document.getElementById('mLearn').setAttribute('aria-pressed', applied === 'learn');
  document.getElementById('mDrill').setAttribute('aria-pressed', applied === 'drill');
  advance();
}

// ---- експорт / імпорт прогресу ----
const ioPanel = document.getElementById('ioPanel');
function closeIO() { ioPanel.classList.remove('show'); ioPanel.innerHTML = ''; }
function ioMsg(kind, text) { const m = document.getElementById('ioMsg'); if (m) { m.textContent = text; m.className = 'io-msg ' + kind; } }

function openExport() {
  store.noteSaved(); // скористався збереженням — нагадування знімаємо
  const code = store.exportCode();
  ioPanel.innerHTML = `<h3>Код прогресу</h3><p>Скопіюй цей код і встав його на іншому пристрої через «Перенести прогрес сюди».</p><textarea id="ioText" readonly>${code}</textarea><div class="io-actions"><button class="btn" id="ioCopy">Копіювати</button><button class="btn ghost" id="ioClose">Закрити</button></div><div class="io-msg" id="ioMsg"></div>`;
  ioPanel.classList.add('show');
  const ta = document.getElementById('ioText');
  document.getElementById('ioCopy').addEventListener('click', async () => {
    ta.select();
    try { await navigator.clipboard.writeText(code); ioMsg('ok', 'Скопійовано.'); }
    catch (e) { try { document.execCommand('copy'); ioMsg('ok', 'Скопійовано.'); } catch (_) { ioMsg('bad', 'Скопіюй вручну: Ctrl/Cmd+C.'); } }
  });
  document.getElementById('ioClose').addEventListener('click', closeIO);
  ta.focus();
}

function openImport() {
  ioPanel.innerHTML = `<h3>Імпорт прогресу</h3><p>Встав код з іншого пристрою. Поточний прогрес буде замінено.</p><textarea id="ioText" placeholder="Встав код тут"></textarea><div class="io-actions"><button class="btn" id="ioApply">Застосувати</button><button class="btn ghost" id="ioClose">Закрити</button></div><div class="io-msg" id="ioMsg"></div>`;
  ioPanel.classList.add('show');
  document.getElementById('ioApply').addEventListener('click', () => {
    try { store.importCode(document.getElementById('ioText').value); location.reload(); }
    catch (e) { ioMsg('bad', e.message || 'Не вдалося імпортувати.'); }
  });
  document.getElementById('ioClose').addEventListener('click', closeIO);
  document.getElementById('ioText').focus();
}

// ---- прив'язки ----
document.getElementById('mLearn').addEventListener('click', () => setMode('learn'));
document.getElementById('mDrill').addEventListener('click', () => setMode('drill'));
document.getElementById('peek').addEventListener('click', e => {
  peek = !peek;
  e.target.textContent = peek ? 'Сховати таблицю' : 'Підглянути таблицю';
  // Відкриття таблиці позначає поточну (ще не відповіджену) картку як підглянуту —
  // її відповідь не зарахується. Закриття прапорець не знімає (robиться лише в next).
  if (peek) session.markPeeked();
  updatePeekNote();
  renderHeat(heatEl, topic, session.data.cards, peek);
});
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Скинути весь прогрес?')) { session.reset(); closeIO(); refresh(); setMode('learn'); }
});
document.getElementById('exportBtn').addEventListener('click', openExport);
document.getElementById('importBtn').addEventListener('click', openImport);

bindKeyboard({
  getCur: () => session.cur,
  isAnswered: () => session.answered,
  // Двокрокова картка: на кроці 1 діють цифри Wo?/Wohin?, на кроці 2 — артиклі.
  getAnswers: () => {
    const cur = session.cur;
    if (!cur) return topic.answers;
    if (cur.card.type === 'twostep' && ts && ts.phase === 'step1') return cur.card.step1.options;
    if (cur.card.type === 'word') return wordView ? wordView.options : [];  // слово: дистрактори поточного показу
    return cur.card.options || topic.answers;   // choice з власними кнопками (прийменники)
  },
  isTextEntry,
  onChoose,
  onCheck: check,
  onNext: advance,
  // Конструктор (order): клавіатура — цифри додають слово з розсипу, Backspace знімає останнє.
  onPlaceIndex: i => { if (order && !session.answered && order.bank[i]) moveWord(order.bank[i].id, order.bank, order.placed); },
  onUnplaceLast: () => { if (order && !session.answered && order.placed.length) moveWord(order.placed[order.placed.length - 1].id, order.placed, order.bank); }
});

setInterval(() => {
  refresh();
  if (!session.cur && session.mode === 'learn' && session.pickNext()) advance();
}, 15000);

refresh();
advance();
</script>
</body>
</html>
