<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Drill — німецька граматика на зубок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Deutsch Drill</div>
  </header>
  <p class="intro">Зубріння німецької граматики через інтервальне повторення. Обери тему — прогрес зберігається в цьому браузері.</p>
  <div class="topics" id="topics"></div>
</div>

<script type="module">
import { topics } from './js/topics/index.js';
import * as store from './js/engine/store.js';

function topicStats(topic) {
  const data = store.getTopic(topic.id);
  const st = id => data.cards[id];
  const now = Date.now();
  const intro = topic.cards.filter(c => st(c.id));
  const total = topic.cards.length;
  const learned = intro.filter(c => st(c.id).b >= 3).length;
  const due = intro.filter(c => st(c.id).due <= now).length + topic.cards.filter(c => !st(c.id)).length;
  return { pct: Math.round(learned / total * 100), due };
}

const stats = topics.map(t => ({ topic: t, ...topicStats(t) }));
// «Продовжити» веде в тему з найбільшою чергою.
const best = stats.slice().sort((a, b) => b.due - a.due)[0];

const el = document.getElementById('topics');
el.innerHTML = stats.map(s => `
  <a class="topic-card" href="play.html?topic=${s.topic.id}">
    <h2>${s.topic.title}</h2>
    <p class="why">${s.topic.blurb || s.topic.subtitle}</p>
    <div class="topic-meta">
      <span class="m"><b>${s.pct}%</b><small>засвоєно</small></span>
      <span class="m"><b>${s.due}</b><small>на черзі</small></span>
    </div>
  </a>
`).join('');

if (best) {
  const cta = document.createElement('a');
  cta.className = 'cta';
  cta.href = `play.html?topic=${best.topic.id}`;
  cta.textContent = 'Продовжити';
  el.appendChild(cta);
}
</script>
</body>
</html>
