<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Präpositionen — перевірка даних</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; margin: 26px 0 8px; }
  .note { color: #666; margin: 0 0 16px; max-width: 78ch; }
  .lang { display: flex; gap: 6px; align-items: center; margin: 0 0 14px; color: #666; font-size: .9rem; }
  .lang button { font: inherit; padding: 4px 12px; border: 1px solid #ccc; background: Canvas; border-radius: 999px; cursor: pointer; color: inherit; }
  .lang button[aria-pressed="true"] { background: #1c6b1c; border-color: #1c6b1c; color: #fff; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 8px; padding: 12px 14px; background: #f4f4f2; border-radius: 10px; }
  .summary b { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; margin: 0 0 6px; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid #ddd; vertical-align: top; }
  @media (prefers-color-scheme: dark) { th, td { border-color: #333; } .summary { background: #222; } .note, .lang { color: #999; } .lang button { border-color: #444; } }
  th { font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: #666; white-space: nowrap; }
  .de { font-weight: 600; } .de b { color: #1c6b1c; }
  @media (prefers-color-scheme: dark) { .de b { color: #8fd68f; } }
  .g-der,.g-dem,.g-den { color: #1479a8; } .g-die { color: #6a9a10; } .g-das { color: #777; }
  .k-akk { color: #9c4a10; } .k-dat { color: #1a4f8f; }
  .why { color: #666; max-width: 52ch; }
  .todo td { background: #fde2e2; }
  @media (prefers-color-scheme: dark) { .todo td { background: #3a1f1f; } }
  .badge { font-size: .78rem; padding: 1px 8px; border-radius: 999px; background: #fde2e2; color: #a33; }
  @media (prefers-color-scheme: dark) { .badge { background: #4a1f1f; color: #e59; } }
  .muted { color: #bbb; }
</style>
</head>
<body>
<div class="lang" id="lang"></div>
<h1 id="title"></h1>
<p class="note" id="note"></p>
<div class="summary" id="summary"></div>
<div id="sections"></div>

<script type="module">
import { FIXED, SENT, MERGE, WECHSEL, VERBS } from './js/topics/praepositionen.data.js';

// Артикль за відмінком і родом (dat/akk) — те саме, що в темі; тут для показу
// вчителю, яку саме форму гра прийме за правильну.
const ART = { dat: { m: 'dem', f: 'der', n: 'dem' }, akk: { m: 'den', f: 'die', n: 'das' } };
const art = (c, g) => (ART[c] && ART[c][g]) || '—';
const esc = s => String(s).replace(/[&<>]/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[x]));

// Речення з підставленою правильною формою: пропуск → відповідь (жирним).
const filled = (text, ans) => esc(text).replace('___', `<b>${esc(ans)}</b>`);
const kasus = c => `<span class="k-${c}">${c === 'akk' ? 'Akkusativ' : 'Dativ'}</span>`;

// Переклад лише інтерфейсу (підписи, пояснення). Німецькі дані не чіпаємо.
const T = {
  uk: {
    htmlLang: 'uk',
    title: 'Präpositionen — перевірка даних для вчителя',
    note: `Кожен рядок — одна картка з <code>js/topics/praepositionen.data.js</code>. Стовпець «форма» показує, що гра прийме за правильну відповідь. Рядки з позначкою <span class="badge">todo</span> у гру <b>не</b> потрапляють (нестандартна поведінка — звірити окремо). Карта засвоєння теми — лише таблиця Wechsel (відмінок × рід); блоки 1–3 у ній не показуються навмисно.`,
    cols: { prep: 'Прийменник', sent: 'Речення / форма', kasus: 'Відмінок', art: 'Артикль', merge: 'Злиття', why: 'Правило (why — його бачить учень)', verbs: 'Дієслова' },
    secs: {
      fixed: '1. Прийменник → відмінок',
      sent: '2. Прийменник + артикль у реченні',
      merge: '3. Злиті форми',
      wechsel: '4. Wechselpräpositionen (двокрокова картка)',
      verbs: '5. Wechsel через дієслівні пари'
    },
    sum: (all, play, todo) => `Усього карток-даних: <b>${all}</b> · у грі <b>${play}</b> · todo <b>${todo}</b>`
  },
  de: {
    htmlLang: 'de',
    title: 'Präpositionen — Datenprüfung für Lehrkräfte',
    note: `Jede Zeile ist eine Karte aus <code>js/topics/praepositionen.data.js</code>. Die Spalte „Form“ zeigt, was das Spiel als richtig akzeptiert. Zeilen mit <span class="badge">todo</span> kommen <b>nicht</b> ins Spiel (nicht-standardhaftes Verhalten — separat prüfen). Die Lernkarte des Themas ist nur die Wechsel-Tabelle (Kasus × Genus); Blöcke 1–3 werden dort bewusst nicht gezeigt.`,
    cols: { prep: 'Präposition', sent: 'Satz / Form', kasus: 'Kasus', art: 'Artikel', merge: 'Verschmelzung', why: 'Regel (why — sieht die lernende Person)', verbs: 'Verben' },
    secs: {
      fixed: '1. Präposition → Kasus',
      sent: '2. Präposition + Artikel im Satz',
      merge: '3. Verschmolzene Formen',
      wechsel: '4. Wechselpräpositionen (zweistufige Karte)',
      verbs: '5. Wechsel über Verbpaare'
    },
    sum: (all, play, todo) => `Datenkarten gesamt: <b>${all}</b> · im Spiel <b>${play}</b> · todo <b>${todo}</b>`
  }
};

const todoBadge = d => d.todo ? ` <span class="badge">todo</span>` : '';
const trClass = d => d.todo ? ' class="todo"' : '';
const noteCell = d => d.todo && d.note ? `<div class="why">↳ ${esc(d.note)}</div>` : '';

function table(head, rowsHtml) {
  return `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsHtml}</tbody></table>`;
}

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.title;
  document.getElementById('title').textContent = t.title;
  document.getElementById('note').innerHTML = t.note;

  const all = FIXED.length + SENT.length + MERGE.length + WECHSEL.length + VERBS.length;
  const todo = [...FIXED, ...SENT, ...MERGE, ...WECHSEL, ...VERBS].filter(d => d.todo).length;
  document.getElementById('summary').innerHTML = `<span>${t.sum(all, all - todo, todo)}</span>`;

  const c = t.cols;
  const secs = [];
  // Правило мовою інтерфейсу: DE — whyDe/why1De (для вчителя), інакше — why/why1.
  const pw = d => esc((lang === 'de' ? d.whyDe : d.why) || d.why || '');
  const pw1 = d => esc((lang === 'de' ? d.why1De : d.why1) || d.why1 || '');

  // 1. FIXED
  secs.push(`<h2>${t.secs.fixed}</h2>` + table([c.prep, c.kasus, c.why], FIXED.map(d =>
    `<tr${trClass(d)}><td class="de">${esc(d.p)}${todoBadge(d)}</td><td>${kasus(d.c)}</td><td class="why">${pw(d)}${noteCell(d)}</td></tr>`
  ).join('')));

  // 2. SENT
  secs.push(`<h2>${t.secs.sent}</h2>` + table([c.sent, c.kasus, c.art, c.why], SENT.map(d =>
    `<tr${trClass(d)}><td class="de">${filled(d.text, art(d.c, d.g))}</td><td>${kasus(d.c)}</td><td class="g-${art(d.c, d.g)}">${art(d.c, d.g)}</td><td class="why">${pw(d)}</td></tr>`
  ).join('')));

  // 3. MERGE
  secs.push(`<h2>${t.secs.merge}</h2>` + table([c.sent, c.merge, c.why], MERGE.map(d =>
    `<tr${trClass(d)}><td class="de">${filled(d.text, d.merge)}</td><td class="de">${esc(d.p)} + ${esc(d.art)} = <b>${esc(d.merge)}</b></td><td class="why">${pw(d)}</td></tr>`
  ).join('')));

  // 4. WECHSEL
  secs.push(`<h2>${t.secs.wechsel}</h2>` + table([c.prep, c.sent, c.kasus, c.art, c.why], WECHSEL.map(d =>
    `<tr${trClass(d)}><td class="de">${esc(d.prep)}${todoBadge(d)}</td><td class="de">${filled(d.text, art(d.c, d.g))}</td><td>${kasus(d.c)}</td><td class="g-${art(d.c, d.g)}">${art(d.c, d.g)}</td><td class="why">${pw1(d)}${noteCell(d)}</td></tr>`
  ).join('')));

  // 5. VERBS
  secs.push(`<h2>${t.secs.verbs}</h2>` + table([c.verbs, c.sent, c.kasus, c.art, c.why], VERBS.map(d =>
    `<tr${trClass(d)}><td class="de">${esc(d.verbs)}</td><td class="de">${filled(d.text, art(d.c, d.g))}</td><td>${kasus(d.c)}</td><td class="g-${art(d.c, d.g)}">${art(d.c, d.g)}</td><td class="why">${pw1(d)}</td></tr>`
  ).join('')));

  document.getElementById('sections').innerHTML = secs.join('');
  document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
}

// Мова — у параметрі адреси (?lang=de), як у genus-review.html.
function currentLang() { return new URLSearchParams(location.search).get('lang') === 'de' ? 'de' : 'uk'; }
function setLang(lang) {
  const u = new URL(location);
  u.searchParams.set('lang', lang);
  history.replaceState(null, '', u);
  render(lang);
}
document.getElementById('lang').innerHTML = `<span>UK / DE:</span>`
  + `<button type="button" data-l="uk">UK</button><button type="button" data-l="de">DE</button>`;
document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.l)));
render(currentLang());
</script>
</body>
</html>
